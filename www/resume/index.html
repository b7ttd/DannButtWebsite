<html lang="en">

    <style>

            RESET & BASE STYLES - BLACK BACKGROUND, WHITE TEXT
        ----------------------------------------------- */
        * {
            margin: 0;
            padding: 0;

        }

        body {

            font-family: 'Inter', sans-serif;
            color: #ffffff;

        /* Typography System - ALL WHITE */
        h1, .h1, h2, .h2, h3, .h3, h4, .h4, h5, h6 {
            color: #ffffff;
        }

        h1, .h1 {

            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        h2, .h2 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 1rem;
        }

        h3, .h3 {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        h4, .h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            margin-bottom: 1rem;
            font-weight: 400;
            color: #ffffff;
        }

        .sqsrte-large {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        a:hover {
            opacity: 0.8;
        }

        /* Layout Utilities */
        .site-wrapper {
            max-width: 100%;
            overflow-x: hidden;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 3vw;
        }

        /* Header Styles - ENLARGED TEXT */
        .site-header {
            position: relative;
            background: #000000;
            padding: 1.5vw 3vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid #333333;
        }

        .header-title a {
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .header-nav-list {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .header-nav-list a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            font-size: 1.2rem;
            transition: opacity 0.2s ease;
        }

        .header-nav-list a:hover,
        .header-nav-list a.active {
            opacity: 0.7;
        }

        /* Responsive Header */
        @media (max-width: 768px) {
            .site-header {
                flex-direction: column;
                text-align: center;
                padding: 4vw;
            }
            .header-nav-list {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .header-title a {
                font-size: 1.5rem;
            }
            .header-nav-list a {
                font-size: 1rem;
            }
        }

        /* Section Styles */
        .page-section {
            padding: 4vw 0;
            width: 100%;
        }

        .full-bleed-section {
            padding: 0;
        }

        /* Hero Video Block */
        .hero-video {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            line-height: 0;
        }
        
        .hero-video video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Two Column Text Section */
        .two-column-text {
            display: flex;
            flex-wrap: wrap;
            gap: 4rem;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .text-left {
            flex: 1.2;
        }

        .text-right {
            flex: 0.8;
            text-align: right;
        }

        @media (max-width: 768px) {
            .two-column-text {
                flex-direction: column;
                gap: 2rem;
                padding: 2rem 1.5rem;
            }
            .text-right {
                text-align: left;
            }
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
            background: #111111;
            border-radius: 12px;
            overflow: hidden;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-card img {
            width: 100%;
            aspect-ratio: 3 / 2;
            object-fit: cover;
            display: block;
        }

        .project-card h3 {
            font-size: 1.25rem;
            margin: 1rem 1rem 0.5rem;
            color: #ffffff;
        }

        .project-card p {
            font-size: 0.9rem;
            color: #cccccc;
            margin: 0 1rem 1rem;
        }

        .project-card .btn {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            padding: 0.6rem 1.2rem;
            margin: 0 1rem 1rem;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 30px;
            text-align: center;
            align-self: flex-start;
            transition: background 0.2s ease;
        }

        .project-card .btn:hover {
            background: #dddddd;
        }

        /* Feature Row */
        .feature-row {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            align-items: center;
            max-width: 1400px;
            margin: 3rem auto;
            padding: 2rem;
        }

        .feature-row.reverse {
            flex-direction: row-reverse;
        }

        .feature-text {
            flex: 1;
            color: #ffffff;
        }

        .feature-image {
            flex: 1;
        }

        .feature-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .feature-row, .feature-row.reverse {
                flex-direction: column;
            }
        }

        /* Horizontal Rule */
        hr {
            margin: 2rem 0;
            border: 0;
            height: 1px;
            background: #333333;
        }

        /* Recent Grid */
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .recent-item h4 {
            margin-bottom: 0.25rem;
            color: #ffffff;
        }

        .recent-item p {
            color: #aaaaaa;
            font-size: 0.9rem;
        }

        /* Footer */
        .site-footer {
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid #222222;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #777777;
            background-color: #000000;
        }

        /* Video Showcase Section */
        .video-container {
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            background: #000000;
        }

        .showcase-video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Carousel Styles */
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .section-subtitle {
            font-size: 1rem;
            color: #aaaaaa;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .carousel-track-container {
            overflow: hidden;
            flex: 1;
            border-radius: 16px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            gap: 2rem;
        }

        .carousel-slide {
            min-width: calc(33.333% - 1.33rem);
            flex-shrink: 0;
        }

        .project-card-carousel {
            background: #111111;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            height: 100%;
        }

        .project-card-carousel:hover {
            transform: translateY(-5px);
        }

        .project-image-wrapper-carousel {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #222222;
        }

        .project-image-wrapper-carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            transition: transform 0.3s ease;
        }

        .project-card-carousel:hover .project-image-wrapper-carousel img {
            transform: scale(1.05);
        }

        .project-category-badge-carousel {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.95);
            color: #000000;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .project-info-carousel {
            padding: 1.25rem;
        }

        .project-title-carousel {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #ffffff;
        }

        .project-role-carousel {
            font-size: 0.8rem;
            color: #aaaaaa;
            margin-bottom: 0.25rem;
        }

        .project-year-carousel {
            font-size: 0.75rem;
            color: #777777;
            margin-bottom: 1rem;
        }

        .btn-carousel {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            padding: 0.5rem 1rem;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 30px;
            transition: all 0.2s ease;
        }

        .btn-carousel:hover {
            background: #dddddd;
            transform: translateX(3px);
        }

        /* Carousel Arrows */
        .carousel-arrow {
            background: #222222;
            border: 1px solid #444444;
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .carousel-arrow:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Carousel Dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444444;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dot:hover {
            background: #888888;
        }

        .dot.active {
            background: #ffffff;
            width: 24px;
            border-radius: 10px;
        }

        /* Filter Buttons */
        .category-filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            padding: 0.5rem 1.25rem;
            background: transparent;
            border: 1.5px solid #444444;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #dddddd;
        }

        .filter-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        .filter-btn.active {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }

        /* Performance Schedule */
        .performance-schedule {
            background: #111111;
            padding: 1.5rem;
            border-radius: 12px;
            margin: 1.5rem 0;
        }
        
        .performance-schedule h3 {
            font-size: 1.2rem;
            margin-top: 1rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        
        .performance-schedule ul {

            margin-bottom: 1rem;
        }
        
        .performance-schedule li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #222222;
            color: #e0e0e0;
        }

        .talkback-badge {
            background: #ffffff;
            color: #000000;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.75rem;
        }

        .talkback-notice {
            background: #111111;
            border-left: 4px solid #ffffff;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        .talkback-notice p {
            margin: 0;
            color: #e0e0e0;
        }
        
        .talkback-notice strong {
            color: #ffffff;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .container {
                padding: 0 1.5rem;
            }
            .projects-grid {
                gap: 1.5rem;
                padding: 0 1rem;

        @media (max-width: 768px) {

            .carousel-arrow {

        }

        @media (max-width: 1024px) and (min-width: 769px) {
            .carousel-slide {
                min-width: calc(50% - 1rem);
            }
        }
    </style>
</head>

    <script>
        // Carousel functionality
        document.addEventListener('DOMContentLoaded', function() {
            const track = document.querySelector('.carousel-track');
            if (!track) return;
            
            const slides = Array.from(document.querySelectorAll('.carousel-slide'));
            const nextButton = document.querySelector('.carousel-arrow.next');
            const prevButton = document.querySelector('.carousel-arrow.prev');
            const dots = document.querySelectorAll('.dot');
            
            let currentIndex = 0;
            let slidesToShow = getSlidesToShow();
            
            function getSlidesToShow() {
                if (window.innerWidth <= 768) return 1;
                if (window.innerWidth <= 1024) return 2;
                return 3;
            }
            
            function updateCarousel() {
                const slideWidth = slides[0].getBoundingClientRect().width;
                const gap = 32;
                const newPosition = currentIndex * (slideWidth + gap);
                track.style.transform = `translateX(-${newPosition}px)`;
                
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentIndex);
                });
            }
            
            function nextSlide() {
                const maxIndex = slides.length - slidesToShow;
                if (currentIndex < maxIndex) {
                    currentIndex++;
                    updateCarousel();
                }
            }
            
            function prevSlide() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateCarousel();
                }
            }
            
            if (nextButton) nextButton.addEventListener('click', nextSlide);
            if (prevButton) prevButton.addEventListener('click', prevSlide);
            
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateCarousel();
                });
            });
            
            window.addEventListener('resize', () => {
                slidesToShow = getSlidesToShow();
                if (currentIndex > slides.length - slidesToShow) {
                    currentIndex = Math.max(0, slides.length - slidesToShow);
                }
                updateCarousel();
            });
            
            updateCarousel();
        });
    </script>
