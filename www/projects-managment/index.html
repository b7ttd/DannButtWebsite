<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Project Management | Dann Butt</title>
    
    <!-- Preconnect for Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    
    <style>
        /* -----------------------------------------------
            RESET & BASE STYLES
        ----------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #000000;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography System */
        h1, .h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        h2, .h2 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 1rem;
        }

        h3, .h3 {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        h4, .h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            margin-bottom: 1rem;
            font-weight: 400;
            color: #2c2c2c;
        }

        .sqsrte-large {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        /* Layout Utilities */
        .site-wrapper {
            max-width: 100%;
            overflow-x: hidden;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 3vw;
        }

        /* Header Styles */
        .site-header {
            position: relative;
            background: transparent;
            padding: 1.5vw 3vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .header-title a {
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #000;
            letter-spacing: -0.01em;
        }

        .header-nav-list {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .header-nav-list a {
            text-decoration: none;
            color: #000;
            font-weight: 500;
            font-size: 1rem;
            transition: opacity 0.2s ease;
        }

        .header-nav-list a:hover,
        .header-nav-list a.active {
            opacity: 0.7;
        }

        /* Responsive Header */
        @media (max-width: 768px) {
            .site-header {
                flex-direction: column;
                text-align: center;
                padding: 4vw;
            }
            .header-nav-list {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* Section Styles */
        .page-section {
            padding: 4vw 0;
            width: 100%;
        }

        .full-bleed-section {
            padding: 0;
        }

        /* Hero Video Block */
        .hero-video {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            line-height: 0;
        }
        
        .hero-video video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Two Column Text Section */
        .two-column-text {
            display: flex;
            flex-wrap: wrap;
            gap: 4rem;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .text-left {
            flex: 1.2;
        }

        .text-right {
            flex: 0.8;
            text-align: right;
        }

        @media (max-width: 768px) {
            .two-column-text {
                flex-direction: column;
                gap: 2rem;
                padding: 2rem 1.5rem;
            }
            .text-right {
                text-align: left;
            }
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-card img {
            width: 100%;
            aspect-ratio: 3 / 2;
            object-fit: cover;
            display: block;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .project-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .project-card p {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 1rem;
        }

        .project-card .btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 30px;
            text-align: center;
            align-self: flex-start;
            transition: background 0.2s ease;
        }

        .project-card .btn:hover {
            background: #333;
        }

        /* Feature Row */
        .feature-row {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            align-items: center;
            max-width: 1400px;
            margin: 3rem auto;
            padding: 2rem;
        }

        .feature-row.reverse {
            flex-direction: row-reverse;
        }

        .feature-text {
            flex: 1;
        }

        .feature-image {
            flex: 1;
        }

        .feature-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .feature-row, .feature-row.reverse {
                flex-direction: column;
            }
        }

        /* Horizontal Rule */
        hr {
            margin: 2rem 0;
            border: 0;
            height: 1px;
            background: #e0e0e0;
        }

        /* Recent Grid */
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .recent-item h4 {
            margin-bottom: 0.25rem;
        }

        .recent-item p {
            color: #666;
            font-size: 0.9rem;
        }

        /* Footer */
        .site-footer {
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid #eaeaea;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #777;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .container {
                padding: 0 1.5rem;
            }
            .projects-grid {
                gap: 1.5rem;
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        
        <!-- HEADER -->
        <header class="site-header">
            <div class="header-title">
                <a href="/">Dann Butt</a>
            </div>
            <nav>
                <ul class="header-nav-list">
                    
                    <li>
                        <a href="/" >
                            Home
                        </a>
                    </li>
                    
                    <li>
                        <a href="/projects/" >
                            Projects
                        </a>
                    </li>
                    
                    <li>
                        <a href="/projects-management/" >
                            Project Management
                        </a>
                    </li>
                    
                    <li>
                        <a href="/resume/" >
                            Resume and About
                        </a>
                    </li>
                    
                </ul>
            </nav>
        </header>

        <main>
            
<section class="page-section">
    <div class="container">
        <div class="projects-management-header">
            <h2 class="projects-title">Project Management</h2>
            <p class="projects-subtitle sqsrte-large">Selected Project Management works</p>
        </div>
        
        <div class="projects-management-grid">
            
        </div>
    </div>
</section>

<style>
    /* Project Management Page Specific Styles */
    .projects-management-header {
        text-align: center;
        margin-bottom: 3rem;
        padding: 2rem 0 1rem;
    }

    .projects-title {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
    }

    .projects-subtitle {
        font-size: 1.2rem;
        color: #555;
        font-weight: 400;
    }

    .projects-management-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 2rem;
        max-width: 1400px;
        margin: 0 auto;
        padding: 1rem 0 3rem;
    }

    .project-management-card {
        position: relative;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .project-management-card:hover {
        transform: translateY(-5px);
    }

    .project-card-link {
        text-decoration: none;
        display: block;
    }

    .project-image-wrapper {
        width: 100%;
        aspect-ratio: 1849 / 1209; /* Maintains the 3:2 aspect ratio from original */
        overflow: hidden;
        border-radius: 8px;
        margin-bottom: 1rem;
        background: #f5f5f5;
    }

    .project-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
    }

    .project-management-card:hover .project-image-wrapper img {
        transform: scale(1.02);
    }

    .project-button-wrapper {
        text-align: center;
    }

    .project-button {
        display: inline-block;
        background: #000;
        color: #fff;
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        border-radius: 30px;
        transition: background 0.2s ease;
        text-align: center;
        width: auto;
        min-width: 200px;
    }

    .project-management-card:hover .project-button {
        background: #333;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .projects-management-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 0 1rem 2rem;
        }
        
        .project-button {
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            min-width: 180px;
        }
        
        .projects-management-header {
            margin-bottom: 2rem;
            padding: 1rem 0 0.5rem;
        }
    }

    @media (max-width: 480px) {
        .projects-management-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        
        .project-button {
            width: 100%;
            min-width: auto;
        }
    }
</style>

        </main>

        <!-- FOOTER -->
        <footer class="site-footer">
            <p>&copy; :2026 Dann Butt. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
